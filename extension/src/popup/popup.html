<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Goobi</title>
    <style>
      /* Keyboard a11y: a consistent, always-visible focus ring (some inputs remove outlines). */
      :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
      /* Vestibular a11y: honor reduced-motion for all CSS motion. */
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
      :root {
        --bg: #14110d;
        --card: #1d1812;
        --row: #221c15;
        --row-hover: #2c241d;
        --line: rgba(214, 154, 92, 0.14);
        --line-strong: rgba(214, 154, 92, 0.24);
        --t1: #f3ead9;
        --t2: #b6a892;
        --t3: #a89a82;
        --blue: #d69a5c;
        --ink: #1a1206;
        --brand: #d69a5c;
        --green: #6fcf7f;
        --teal: #65c7b1;
        --amber: #e89a3c;
        --red: #d6604a;
        --focus: #e89a3c;
        --accent-hover: #e7b277;
        --radius-card: 16px;
        --radius-row: 12px;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      html, body { width: 100%; min-height: 100vh; }
      body {
        background:
          radial-gradient(circle at 15% -5%, rgba(214,154,92,.13), transparent 32%),
          var(--bg);
        color: var(--t1);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
        font-size: 13px;
        line-height: 1.4;
        -webkit-font-smoothing: antialiased;
      }
      .wrap { width: 100%; max-width: 560px; margin: 0 auto; padding: 16px; min-height: 100vh; overflow-x: hidden; }
      .wrap::-webkit-scrollbar { width: 8px; }
      .wrap::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 8px; }

      .vtabs { display: flex; gap: 4px; margin-top: 16px; padding: 4px; background: rgba(20,17,13,.58); border: 1px solid var(--line); border-radius: 13px; }
      .vtab { flex: 1; background: none; border: 1px solid transparent; color: var(--t2);
              min-height: 40px; font: 600 13px inherit; padding: 9px; border-radius: 9px; cursor: pointer; }
      .vtab:hover { color: var(--t1); }
      .vtab.on { background: rgba(214,154,92,.14); border-color: rgba(214,154,92,.42); color: #e0a45c; }
      [hidden] { display: none !important; }

      #goobi-face { background: none !important; width: auto; height: auto; padding: 0; border: 0; flex: none; }
      .gcv { display: block; image-rendering: pixelated; transform-origin: bottom center; }
      .g-bob { animation: g-bob 1.7s ease-in-out infinite; }
      .g-snooze { animation: g-snooze 3.8s ease-in-out infinite; }
      @keyframes g-snooze { 0%,100% { transform: scale(1,1) rotate(-3deg); } 50% { transform: scale(1.03,1.06) rotate(3deg); } }
      .g-wobble { animation: g-wobble 1.6s ease-in-out infinite; }
      .g-tada { animation: g-tada .9s ease-in-out infinite; }
      .g-trick { animation: g-trick 1.05s ease-in-out infinite; }
      .g-spin { animation: g-spin .9s ease-in-out infinite; }
      .g-flip { animation: g-flip .85s ease-in-out infinite; }
      @keyframes g-trick { 0% { transform: rotate(0) translateY(0) scale(1); } 18% { transform: rotate(-12deg) translateY(-34%) scale(1.06); } 60% { transform: rotate(360deg) translateY(0) scale(1.06); } 80% { transform: rotate(360deg) translateY(-12%) scale(1); } 100% { transform: rotate(360deg) translateY(0) scale(1); } }
      @keyframes g-spin { 0% { transform: rotate(0) scale(1); } 50% { transform: rotate(180deg) scale(1.08); } 100% { transform: rotate(360deg) scale(1); } }
      @keyframes g-flip { 0% { transform: translateY(0) rotate(0); } 40% { transform: translateY(-48%) rotate(-180deg); } 70% { transform: translateY(-12%) rotate(-360deg); } 100% { transform: translateY(0) rotate(-360deg); } }
      .g-think { animation: g-think 1.5s ease-in-out infinite; }
      .g-love { animation: g-love .85s ease-in-out infinite; }
      @keyframes g-love { 0%,100% { transform: translateY(0) scale(1,1) rotate(0); } 25% { transform: translateY(-13%) scale(1.04,.96) rotate(-4deg); } 50% { transform: translateY(0) scale(1.07,.93); } 75% { transform: translateY(-13%) scale(1.04,.96) rotate(4deg); } }
      .g-hunt { animation: g-hunt 1.1s ease-in-out infinite; }
      @keyframes g-hunt { 0% { transform: translateX(-7%) translateY(0); } 25% { transform: translateX(-7%) translateY(-9%); } 50% { transform: translateX(7%) translateY(0); } 75% { transform: translateX(7%) translateY(-9%); } 100% { transform: translateX(-7%) translateY(0); } }
      .g-wiggle { animation: g-wiggle .85s ease-in-out infinite; }
      .g-bounce { animation: g-bounce .65s ease-in-out infinite; }
      .g-heartbeat { animation: g-heartbeat 1.3s ease-in-out infinite; }
      .g-float { animation: g-float 3.6s ease-in-out infinite; }
      .g-jump { animation: g-jump 1.1s ease-in-out infinite; }
      .g-dance { animation: g-dance 1.8s ease-in-out infinite; }
      .g-slide { animation: g-slide 1.7s ease-in-out infinite; }
      .g-wave { animation: g-wave 1.1s ease-in-out infinite; }
      @keyframes g-jump { 0% { transform: translateY(0) scale(1,1); } 15% { transform: translateY(0) scale(1.1,.9); } 35% { transform: translateY(-45%) scale(.94,1.08); } 50% { transform: translateY(-50%) scale(1,1); } 65% { transform: translateY(0) scale(1.1,.9); } 85%,100% { transform: translateY(0) scale(1,1); } }
      @keyframes g-dance { 0% { transform: translateY(0) rotate(5deg) scale(1.05,.95); } 25% { transform: translateY(-14%) rotate(2deg) scale(.95,1.05); } 50% { transform: translateY(0) rotate(-5deg) scale(1.05,.95); } 75% { transform: translateY(-14%) rotate(-2deg) scale(.95,1.05); } 100% { transform: translateY(0) rotate(5deg) scale(1.05,.95); } }
      @keyframes g-slide { 0% { transform: translateX(-46%) translateY(0); } 25% { transform: translateX(-46%) translateY(-9%); } 50% { transform: translateX(46%) translateY(0); } 75% { transform: translateX(46%) translateY(-9%); } 100% { transform: translateX(-46%) translateY(0); } }
      @keyframes g-wave { 0%,100% { transform: rotate(0) translateY(0); } 15% { transform: rotate(-15deg) translateY(-6%); } 35% { transform: rotate(11deg); } 55% { transform: rotate(-11deg); } 75% { transform: rotate(8deg); } }
      @keyframes g-think { 0%,100% { transform: translateY(0) scale(1,1); } 50% { transform: translateY(-5%) scale(1.02,1.03); } }
      @keyframes g-wiggle { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
      @keyframes g-bounce { 0% { transform: translateY(0) scale(1.06,.94); } 30% { transform: translateY(-34%) scale(1,1); } 50% { transform: translateY(0) scale(1.08,.92); } 68% { transform: translateY(-10%) scale(1,1); } 100% { transform: translateY(0) scale(1.06,.94); } }
      @keyframes g-heartbeat { 0%,42%,100% { transform: scale(1); } 10%,30% { transform: scale(1.1); } 20% { transform: scale(1); } }
      @keyframes g-float { 0% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-9%) rotate(2deg); } 100% { transform: translateY(0) rotate(-2deg); } }
      @keyframes g-tada { 0%,100% { transform: scale(1) rotate(0); } 20% { transform: scale(1.12) rotate(-7deg); } 40%,60%,80% { transform: scale(1.14) rotate(7deg); } 50%,70% { transform: scale(1.14) rotate(-7deg); } }
      @keyframes g-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9%); } }
      @keyframes g-wobble { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
      @media (prefers-reduced-motion: reduce) { .gcv { animation: none; } }

      /* ---------- Goobi's playground ---------- */
      .pg-back { background: none; border: 0; color: var(--brand); font: 600 13px inherit; cursor: pointer; padding: 8px 2px; }
      .pg-back:hover { color: var(--blue); }
      .pg-stage { position: relative; width: 100%; height: 170px; margin: 4px 0 14px; border-radius: 14px; background: var(--row); color: inherit;
                  border: 1px solid var(--line); display: flex; align-items: flex-end; justify-content: center;
                  padding: 0 0 28px; cursor: pointer; overflow: hidden; }
      .pg-shadow { position: absolute; bottom: 24px; width: 58px; height: 12px; background: rgba(0,0,0,.28); border-radius: 50%; filter: blur(2px); }
      #goobi-pg { position: relative; z-index: 1; }
      .pg-msg { text-align: center; font-size: 13.5px; color: var(--t1); min-height: 20px; margin-bottom: 12px; }
      .pg-meter { height: 11px; border-radius: 6px; background: var(--row); border: 1px solid var(--line); overflow: hidden; }
      .pg-fill { height: 100%; background: var(--brand); border-radius: 6px; transition: width .35s ease; }
      .pg-meterlbl { display: flex; justify-content: space-between; font-size: 11px; color: var(--t3); margin-top: 5px; }
      .pg-treats { display: flex; flex-wrap: wrap; gap: 9px; justify-content: center; margin-top: 18px; }
      .pg-treat { width: 30px; height: 30px; border-radius: 50%; border: 0; cursor: pointer; transition: transform .1s;
                  background: radial-gradient(circle at 35% 30%, #f0b07e, #c25e3f); box-shadow: 0 1px 3px rgba(0,0,0,.35); }
      .pg-treat:hover { transform: scale(1.14); }
      .pg-treat:active { transform: scale(.92); }

      .row-flex { display: flex; align-items: center; }
      .between { justify-content: space-between; }
      .gap8 { gap: 8px; } .gap10 { gap: 10px; } .gap12 { gap: 12px; }
      .grow { flex: 1; min-width: 0; }
      .trunc { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .muted { color: var(--t2); } .dim { color: var(--t3); }

      .sq { width: 34px; height: 34px; border-radius: 9px; display: flex;
            align-items: center; justify-content: center; color: #fff; flex: none; }
      .sq svg { width: 19px; height: 19px; }

      /* header */
      header { margin-bottom: 14px; gap: 10px; }
      header > * { min-width: 0; }
      .brand { font-family: Georgia, "Times New Roman", "Iowan Old Style", serif; font-size: 17px; font-weight: 600; letter-spacing: -0.005em; }
      .wordmark { display: flex; flex-direction: column; line-height: 1.1; }
      .tagline { font-size: 10.5px; color: var(--blue); margin-top: 1px; }
      .pill { display: inline-flex; align-items: center; gap: 6px; min-width: 0; font-size: 11.5px;
              color: var(--t2); background: var(--card); border: 0.5px solid var(--line);
              padding: 4px 9px; border-radius: 999px; }
      .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }

      /* smart toggle */
      .switch { position: relative; width: 38px; height: 22px; flex: none; cursor: pointer; }
      .switch input { opacity: 0; width: 0; height: 0; }
      .track { position: absolute; inset: 0; background: #3a3f4a; border-radius: 999px; transition: background .15s; }
      .knob { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; background: #fff;
              border-radius: 50%; transition: transform .15s; }
      .switch input:checked + .track { background: var(--blue); }
      .switch input:checked + .track .knob { transform: translateX(16px); }

      /* cards */
      .card { background: var(--card); border: 1px solid var(--line);
              border-radius: var(--radius-card); padding: 16px; }
      .list { background: var(--card); border: 1px solid var(--line);
              border-radius: 14px; overflow: hidden; }
      .li { display: flex; align-items: center; gap: 12px; padding: 9px 13px; cursor: default; }
      .li + .li { border-top: 1px solid var(--line); }
      .li.click { cursor: pointer; }
      .li.click:hover { background: var(--row-hover); }
      .li .name { font-size: 13.5px; font-weight: 500; }
      .li .sub { font-size: 11.5px; color: var(--t3); margin-top: 1px; }

      .sec { display: flex; align-items: center; justify-content: space-between;
             margin: 18px 4px 8px; }
      .sec h2 { font-size: 11px; font-weight: 600; letter-spacing: .04em;
                text-transform: uppercase; color: var(--t3); margin: 0; }

      /* memory */
      .mem { display: flex; align-items: center; gap: 16px; }
      .ring { position: relative; width: 92px; height: 92px; flex: none; }
      .ring .pct { position: absolute; inset: 0; display: flex; flex-direction: column;
                   align-items: center; justify-content: center; }
      .ring .pct b { font-size: 20px; font-weight: 600; }
      .ring .pct span { font-size: 10px; color: var(--t3); }
      .mem-meta .big { font-size: 14px; font-weight: 500; }
      .legend { display: flex; gap: 14px; margin-top: 10px; font-size: 11.5px; color: var(--t2); }
      .legend span { display: inline-flex; align-items: center; gap: 5px; }

      /* buttons */
      button { font-family: inherit; cursor: pointer; }
      button:disabled { cursor: not-allowed; opacity: .55; }
      .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px;
             min-height: 40px; font-size: 13px; font-weight: 600; border-radius: 11px; padding: 9px 14px;
             border: 1px solid var(--line-strong); background: var(--row); color: var(--t1);
             transition: background .12s; }
      .btn:hover { background: var(--row-hover); }
      .btn svg { width: 16px; height: 16px; }
      .btn.primary { background: var(--blue); border-color: transparent; color: var(--ink); font-weight: 600; }
      .btn.primary:hover { background: var(--accent-hover); }
      .btn.ghost { background: transparent; }
      .chip { font-size: 11.5px; font-weight: 500; padding: 3px 8px; border-radius: 999px; }

      .status { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; flex: none; }
      .act { font-size: 12.5px; font-weight: 500; color: var(--blue); background: none;
             border: none; padding: 4px 6px; }
      .act.danger { color: var(--red); }
      .chev { color: var(--t3); display: flex; }
      .chev svg { width: 16px; height: 16px; }

      /* search */
      .search { display: flex; align-items: center; gap: 9px; background: var(--card);
                border: 0.5px solid var(--line); border-radius: 11px; padding: 9px 12px; }
      .search svg { width: 17px; height: 17px; color: var(--t3); flex: none; }
      .search input { flex: 1; background: transparent; border: none; outline: none;
                      color: var(--t1); font-family: inherit; font-size: 13px; }
      .search input::placeholder { color: var(--t3); }
      .kbd { font-size: 10.5px; color: var(--t2); background: var(--row); border: 0.5px solid var(--line);
             border-radius: 5px; padding: 1px 6px; }

      .footer-actions { display: flex; gap: 8px; margin-top: 12px; }
      .footer-actions .btn { flex: 1; }
      .note { display: flex; gap: 7px; align-items: flex-start; margin-top: 12px;
              font-size: 11.5px; color: var(--t2); line-height: 1.5; }
      .note svg { width: 14px; height: 14px; flex: none; margin-top: 1px; }
      .empty { padding: 16px 13px; font-size: 12.5px; color: var(--t3); text-align: center; }
      .setup { margin-top: 12px; background: linear-gradient(145deg, rgba(214,154,92,.12), rgba(214,154,92,.035));
               border: 1px solid rgba(214,154,92,.28); border-radius: 14px; padding: 16px; }
      .setup-title { font-family: Georgia, "Times New Roman", serif; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
      .setup-sub { color: var(--t2); font-size: 12px; margin-top: 4px; line-height: 1.5; }
      .data-disclosure { margin-top: 12px; padding: 10px; border: 1px solid rgba(214,154,92,.28); border-radius: 9px; background: rgba(20,17,13,.42); color: var(--t2); font-size: 11.5px; line-height: 1.45; }
      .data-disclosure b { display: block; color: var(--t1); margin-bottom: 4px; }
      .data-consent { display: flex; align-items: flex-start; gap: 7px; margin-top: 8px; color: var(--t1); cursor: pointer; }
      .data-consent input { margin-top: 2px; accent-color: var(--amber); }
      .setup-steps { display: flex; gap: 6px; margin-top: 10px; }
      .setup-step { flex: 1; min-width: 0; padding: 7px 8px; border-radius: 8px; background: rgba(20,17,13,.5);
                    color: var(--t2); font-size: 12px; }
      .setup-step.done { color: var(--green); }
      details.fold { margin-top: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
      details.fold > summary { list-style: none; display: flex; align-items: center; justify-content: space-between;
                               gap: 8px; padding: 11px 13px; cursor: pointer; color: var(--t1); font-weight: 500; }
      details.fold > summary::-webkit-details-marker { display: none; }
      details.fold > summary::after { content: '›'; color: var(--t3); font-size: 18px; transform: rotate(90deg); }
      details.fold[open] > summary::after { transform: rotate(-90deg); }
      details.fold[open] > summary { border-bottom: 1px solid var(--line); }
      details.fold .list { border: 0; border-radius: 0; }
      .toast { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; box-sizing: border-box;
               font-size: 12px; color: var(--green); text-align: center; margin: 0;
               padding: 9px 14px; background: var(--bg); border-top: .5px solid var(--line-strong); }
      .toast:empty { display: none; }

      .field { display: block; margin-bottom: 6px; color: var(--t1); font-size: 13px; font-weight: 600; }
      .field-hint { color: var(--t2); font-size: 12px; font-weight: 400; }
      .control { width: 100%; min-width: 0; box-sizing: border-box; background: var(--row); border: 1px solid var(--line-strong); border-radius: 9px; color: var(--t1); padding: 9px 10px; font: 12.5px/1.4 inherit; outline: none; }
      .control:hover { border-color: rgba(214,154,92,.3); }
      .control:focus { border-color: var(--blue); box-shadow: 0 0 0 2px rgba(214,154,92,.12); }
      textarea.control { resize: vertical; }
      .input-action { display: flex; gap: 8px; align-items: stretch; min-width: 0; }
      .input-action > .control { flex: 1 1 180px; }
      .input-action > .btn { flex: 0 0 auto; white-space: nowrap; }
      .soul-control { min-height: 190px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; line-height: 1.55; }
      .soul-foot { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-top:7px; color:var(--t2); font-size:10.5px; line-height:1.4; }
      .soul-foot .act { flex:0 0 auto; }
      .goal-inputs { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-top:7px; }
      .goal-inputs label { display:flex; flex-direction:column; gap:5px; color:var(--t2); font-size:10.5px; font-weight:600; }
      .goal-inputs .control { text-align:center; font-size:14px; font-weight:700; }
      .profile-fold > summary { background: linear-gradient(145deg, rgba(214,154,92,.07), transparent); }
      .posting-receipt { display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr); gap:7px; align-items:center;
                         padding:10px; border:1px solid var(--line-strong); border-radius:11px; background:rgba(20,17,13,.42); }
      .posting-receipt.ready { border-color:rgba(101,199,177,.42); background:linear-gradient(145deg,rgba(101,199,177,.09),rgba(20,17,13,.35)); animation:model-in .28s ease-out; }
      .posting-receipt.paused { border-color:rgba(232,154,60,.38); }
      .receipt-step { min-width:0; }
      .receipt-step span { display:block; color:var(--t3); font-size:9.5px; font-weight:700; letter-spacing:.055em; text-transform:uppercase; }
      .receipt-step b { display:block; margin-top:3px; color:var(--t1); font-size:11px; font-weight:600; line-height:1.3; overflow-wrap:anywhere; }
      .posting-receipt.ready .receipt-step:last-child b { color:var(--teal); }
      .receipt-arrow { color:var(--t3); font-size:13px; }
      .model-chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; }
      .model-chip { display:inline-flex; align-items:center; min-height:24px; padding:3px 8px; border-radius:999px; border:1px solid rgba(101,199,177,.28); background:rgba(101,199,177,.08); color:var(--teal); font-size:10.5px; font-weight:600; }
      .model-chip.muted { border-color:var(--line-strong); background:var(--row); color:var(--t2); }
      .model-facts { display:flex; flex-wrap:wrap; gap:6px 12px; margin-top:9px; color:var(--t2); font-size:10.5px; font-variant-numeric:tabular-nums; }
      .model-facts b { color:var(--t1); font-weight:700; }
      .model-warning { margin-top:9px; padding:8px 9px; border:1px solid rgba(232,154,60,.35); border-radius:8px; background:rgba(232,154,60,.08); color:#f0bd78; font-size:10.5px; line-height:1.45; }
      .model-import-state { display:flex; align-items:center; gap:8px; margin-top:9px; padding:8px 9px; border-radius:8px; font-size:10.5px; line-height:1.45; }
      .model-import-state.loading { border:1px solid rgba(101,199,177,.3); background:rgba(101,199,177,.07); color:var(--teal); }
      .model-import-state.error { border:1px solid rgba(214,96,74,.38); background:rgba(214,96,74,.08); color:#ee9a88; }
      .model-import-state .spin { width:13px; height:13px; }
      @keyframes model-in { from { transform:translateY(2px); opacity:.72; } to { transform:translateY(0); opacity:1; } }
      .ready-line { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; }
      .ready-check { color: var(--green); font-size: 12px; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

      /* keyboard focus — visible on the dark theme */
      .btn:focus-visible, .act:focus-visible, .click:focus-visible {
        outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 10px;
      }
      .switch input:focus-visible + .track { outline: 2px solid var(--blue); outline-offset: 2px; }

      .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
      .toolbar .btn { flex: 1; min-width: 110px; }
      .loader { display: flex; align-items: center; gap: 10px; padding: 16px 6px; color: var(--t2); font-size: 13px; }
      .spin { width: 16px; height: 16px; border: 2px solid var(--line-strong); border-top-color: var(--blue);
              border-radius: 50%; animation: tb-spin .7s linear infinite; flex: none; }
      @keyframes tb-spin { to { transform: rotate(360deg); } }
